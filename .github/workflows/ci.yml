name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run offline tests
        run: node --test "test/*.test.mjs"
      - name: Parse workflow YAML
        run: >
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { parseDocument } from 'yaml'; const document = parseDocument(readFileSync('.github/workflows/ci.yml', 'utf8')); if (document.errors.length) throw document.errors[0];"
