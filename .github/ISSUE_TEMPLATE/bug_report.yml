name: Bug report
description: Report a reproducible problem with Mallo
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Remove prompts, command arguments, results, credentials, private reasoning, and personal paths from all evidence.
  - type: input
    id: mallo-version
    attributes:
      label: Mallo version or commit
      placeholder: 0.3.0 or commit SHA
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex version
      placeholder: Desktop or CLI version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Codex Desktop MCP checkpoints
        - Codex Desktop final summary
        - Codex CLI hooks
        - CLI diagnostics
        - Installation or discovery
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence.
      placeholder: |
        1. Install...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add a short log or output snippet only if it contains no private data.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, command arguments, results, credentials, private reasoning, and personal paths.
          required: true
